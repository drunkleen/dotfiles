# Sakura Rain: desktop petal overlay.
# Apply changes with: sakura-rain restart
#
# Resolution order for each setting:
#   built-in defaults  <  preset (presets.toml)  <  [settings] below

enabled = true

# zen | sakura | storm | custom
#   zen     few petals, extremely slow
#   sakura  balanced natural motion (default)
#   storm   stronger wind, more petals
#   custom  no preset values; only [settings] and defaults apply
preset = "sakura"

[settings]
# Uncomment a line to override the preset value for that key.

petal_count = 150               # 1..200 petals on each monitor
spawn_rate = 10                 # 0 none | 0.5 sparse | 2 steady | 10 dense (petals/s, 0..10)
fall_speed = 300                # very_slow 30 | slow 60 | medium 100 | fast 160 | px/s 0..300
wind_strength = 3.0             # 0 still | 0.15 breeze | 1 strong | 3 gale (0..3)
depth_spread = 0.6              # 0 flat | 0.6 natural | 1 wide 3D depth (0..1)
rotation_speed = "medium"       # off | slow | medium | fast, or a number 0..4
opacity = 0.75                  # 0..1
petal_size = [5, 20]            # min and max petal size in px
# fps_limit = 30                  # 30 or 60 (10..120 accepted)
pause_on_fullscreen = true      # hide while a window is fullscreen (games, video)
# avoid_windows = true            # petals fade out under app windows; only the wallpaper shows them
# click_through = true            # false makes the overlay capture mouse clicks
color_palette = "dark_red"      # dark_red | dusty_pink (see presets.toml)
rendering_layer = "background"  # background: over wallpaper only; top: over windows
